name: Pivotal Health
description: 'Pivotal Health (formerly Radix Health) is a healthcare technology company
  and self-described "IDR Authority" that helps medical providers secure fair out-of-network
  reimbursement through the federal Independent Dispute Resolution (IDR) process created
  by the No Surprises Act. Its platform combines automated eligibility screening, dispute
  submission software integrated with major revenue cycle management (RCM) systems,
  payer data, and white-glove managed services across emergency medicine, anesthesiology,
  radiology, surgery, pathology, air ambulance, and hospitals and health systems. Pivotal
  Health is backed by Bessemer Venture Partners.'
